[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "babble"
version = "0.1.0"
description = "A tiny transformer with random weights that learns to talk only from Discord corrections."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Deliberately tiny. torch for the model, discord.py for the bot, hub for the export.
# No numpy, no datasets, no transformers, no tokenizer downloads -- on the
# production/live path. `datasets` is an optional extra (below), needed only
# by pretrain_hf.py to stream the HF pretrain corpus; the bot, trainer, and
# post-train never import it.
dependencies = [
    "torch>=2.1",
    "discord.py>=2.3",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Only needed to run pretrain_hf.py (Stage 1, HF-dataset streaming) locally
# for a smoke test. `pretrain_hf.py` itself is deliberately self-contained
# (see its module docstring) and declares this same dependency via its own
# PEP 723 `# /// script` header for `uv run`/`hf jobs uv run` -- this extra
# exists so `pip install -e .[pretrain]` also works for local development.
pretrain = ["datasets>=2.19,<3", "pyarrow>=14"]

[project.scripts]
babble = "babble.cli:main"

[tool.setuptools.packages.find]
include = ["babble*"]

[tool.setuptools.package-data]
babble = ["blocklist.txt"]

# uv users get the CPU-only torch build automatically -- no multi-GB CUDA wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
# `slow` marks the tests that actually train a model to convergence. They are
# not skipped by default -- the memorisation gate is the whole point -- but
# `-m "not slow"` gets you a fast inner loop while editing.
markers = ["slow: trains a real model; seconds, not milliseconds"]
